<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Signup</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex">
          <div class="flex flex-col justify-center min-h-screen mx-auto my-auto">
            <div class="flex flex-col gap-1 items-center rounded-lg border p-[2rem]">
              <form>
                <div class="flex flex-col justify-center p-[1rem] mb-[1rem]">
                       <div>
                            <h1 class="flex font-bold justify-center text-3xl">
                                   Create an account
                             </h1>
                        </div>
                        <div>
                            <h6 class="flex flex-col items-center text-base/10">
                              Connect with your friends today!
                            </h6>
                        </div>
                </div>
                <div class="flex flex-col my-5">
                  <div>
                  <input type="username" id="username" placeholder="Enter your username" class="p-2 px-[3.3rem] my-2 rounded-md outline-1 outline-gray-300 focus:outline-2 focus:outline-blue-600 focus:outline-offset-2">
                </div>
                  <div>
                    <input type="email" id="email" placeholder="Enter your email" class="p-2 px-[3.3rem] my-2 rounded-md outline-1 outline-gray-300 focus:outline-2 focus:outline-blue-600 focus:outline-offset-2">
                  </div>
                  <div>
                    <input type="number" id="phoneNumber" placeholder="Enter your phone number" class="p-2 px-[3.3rem] my-2 rounded-md outline-1 outline-gray-300 focus:outline-2 focus:outline-blue-600 focus:outline-offset-2">
                  </div>
                  <div>
                    <input type="password" id="password" placeholder="Enter your password" class="p-2 px-[3.3rem] my-2 rounded-md outline-1 outline-gray-300 focus:outline-2 focus:outline-blue-600 focus:outline-offset-2">
                  </div>
              </div>
                <div>
                  <a href="#" class="flex justify-center rounded-md my-6 bg-sky-600 py-2 font-medium font-sans" id="submit">Sign Up</a>
                </div>
                <span class="flex justify-center my-[2rem]">
                  ———————or with———————
                </span>
                <div class="flex rounded-md my-4 bg-blue-600">
                  <button class="flex gap-6 p-2 ">
                    <div>
                    <svg xmlns="http://www.w3.org/2000/svg" 
                width="32" 
                height="32" 
                viewBox="0 0 256 256"
                ><!-- Icon from SVG Logos by Gil Barbara - https://raw.githubusercontent.com/gilbarbara/logos/master/LICENSE.txt -->
                <path 
                  opacity=10%
                  fill="#1877f2" d="M256 128C256 57.308 198.692 0 128 0S0 57.308 0 128c0 63.888 46.808 116.843 108 126.445V165H75.5v-37H108V99.8c0-32.08 19.11-49.8 48.348-49.8C170.352 50 185 52.5 185 52.5V84h-16.14C152.959 84 148 93.867 148 103.99V128h35.5l-5.675 37H148v89.445c61.192-9.602 108-62.556 108-126.445"/>
                <path fill="#fff" d="m177.825 165l5.675-37H148v-24.01C148 93.866 152.959 84 168.86 84H185V52.5S170.352 50 156.347 50C127.11 50 108 67.72 108 99.8V128H75.5v37H108v89.445A129 129 0 0 0 128 256a129 129 0 0 0 20-1.555V165z"/>
              </svg>
                    </div>
                    <div class="flex items-center font-sans text-base subpixel-antialiased font-medium">
                      Sign Up with facebook
                    </div>
                  </button>
                </div>
                <div class="flex border rounded-md my-4">
                  <button class="flex gap-6 p-2">
                    <div class="flex items-center">
                        <svg
                  xmlns="http://www.w3.org/2000/svg"
                 width="19.27" 
                 height="20"
                  viewBox="0 0 256 262">
                  <!-- Icon from SVG Logos by Gil Barbara - https://raw.githubusercontent.com/gilbarbara/logos/master/LICENSE.txt -->
                   <path fill="#4285F4" d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622l38.755 30.023l2.685.268c24.659-22.774 38.875-56.282 38.875-96.027"/><path fill="#34A853" d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055c-34.523 0-63.824-22.773-74.269-54.25l-1.531.13l-40.298 31.187l-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1"/><path fill="#FBBC05" d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82c0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602z"/><path fill="#EB4335" d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0C79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251"/></svg>
                    </div>
                    <div class="flex items-center font-medium font-sans">
                      Sign Up with Google
                    </div>
                  </button>
                </div>
                <div class="flex justify-between">
                  <span><u>Already have and account?</u></span>
                  <b> <a href="login-form.html" class="text-blue-600">Log in</a></b>
                </div>
              </form>
            </div>
          </div>
          <script src="app.js">
document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault(); // stop page reload

  const name = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();
    console.log('Signup response:', data);

    if (res.ok) {
      alert('Signup successful! Token: ' + data.token);
      localStorage.setItem('token', data.token); // store JWT
    } else {
      alert('Error: ' + (data.message || res.statusText));
    }
  } catch (err) {
    console.error(err);
    alert('Something went wrong');
  }
});
</script>
</body>
</html>
