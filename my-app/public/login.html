<script src="app.js">
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const loginBtnContent = structuredClone(loginBtn.innerHTML);

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginBtn.disabled = true;
  loginBtn.innerHTML = `<svg ...spinner...></svg>`; // keep your spinner

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem("token", data.token); // save JWT
      loginError.style.display = "none";
      alert("Login successful!");
      // optionally redirect:
      // window.location.href = "/dashboard.html";
    } else {
      loginError.innerText = data.message || "Invalid credentials";
      loginError.style.display = "block";
    }
  } catch (err) {
    console.error(err);
    loginError.innerText = "Something went wrong";
    loginError.style.display = "block";
  } finally {
    loginBtn.innerHTML = loginBtnContent;
    loginBtn.disabled = false;
  }
});
</script>
